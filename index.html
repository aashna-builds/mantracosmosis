<title>Mantra Cosmosis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Tiro+Devanagari+Hindi&family=Noto+Serif+Tibetan&display=swap">
<style>
/* Layout: full-bleed cosmos canvas, a particle deity bust centred in it, the mantra panel along the bottom.
   Two looks, Shiva (bronze, gold, indigo) and Kali (crimson and black), switched by data-mode. Dark by choice. */
:root{
  --bg:#02030a; --fg:#ece8ff; --dim:#8b88b4; --line:#1d1b3f;
  --gold:#f2c46d; --glow:242,196,109;
  --panel:rgba(5,5,18,.72);
  --display:'Cinzel',Georgia,serif; --dev:'Tiro Devanagari Hindi','Noto Serif Devanagari','Noto Serif Tibetan',serif;
  color-scheme:dark;
}
:root[data-mode="tara"]{ --bg:#02080a; --gold:#7ee0a8; --glow:126,224,168; --line:#16352c; --dim:#8fb0a4; --fg:#e8fff3; --panel:rgba(3,12,12,.74); }
:root[data-mode="hanuman"]{ --bg:#080302; --gold:#ff7a2a; --glow:255,122,42; --line:#401a0c; --dim:#b0988a; --fg:#fff0e2; --panel:rgba(14,5,3,.76); }
:root[data-mode="gayatri"]{ --bg:#05040e; --gold:#ffb347; --glow:255,179,71; --line:#3a2a1c; --dim:#a8a2a0; --fg:#fff3de; --panel:rgba(10,6,16,.74); }
:root[data-mode="ganesha"]{ --bg:#07030a; --gold:#ff8f4a; --glow:255,143,74; --line:#3a1c1c; --dim:#b09a9a; --fg:#fff0e4; --panel:rgba(14,5,10,.74); }
:root[data-mode="monk"]{ --bg:#03060f; --gold:#ffc24a; --glow:255,194,74; --line:#33291a; --dim:#a29f9a; --fg:#fff4dc; --panel:rgba(8,8,16,.74); }
:root[data-mode="bhairav"]{ --bg:#02030a; --gold:#ff9a3c; --glow:255,150,60; --line:#1d2540; --dim:#8c93ad; --fg:#eef0ff; --panel:rgba(4,6,14,.78); }
:root[data-mode="kali"]{ --bg:#050003; --gold:#ff5468; --glow:255,70,90; --line:#3a0d18; --dim:#a8808c; --fg:#ffe9ec; --panel:rgba(14,2,6,.76); }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
.hud{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));
  right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud *{pointer-events:auto}
.hud .id{flex:1 1 auto;min-width:0;max-width:calc(100% - 150px);pointer-events:none}
.hud .id *{pointer-events:none}
.title{font-size:12px;line-height:1.5;letter-spacing:.26em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.sub{font-family:var(--dev);color:var(--gold);font-size:15px;line-height:1.35;margin-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.status{font-size:11px;letter-spacing:.2em;color:color-mix(in srgb,var(--fg) 60%,var(--dim));margin-top:6px;text-transform:uppercase;min-height:14px;line-height:1.4;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--ph,150px) + 88px);
  width:max-content;max-width:min(250px,calc(100vw - 48px));text-align:center;font:400 11px/1.4 var(--display);letter-spacing:.03em;color:var(--fg);
  background:var(--panel);border:1px solid rgba(var(--glow),.35);border-radius:16px;padding:6px 14px;backdrop-filter:blur(6px);pointer-events:none;
  animation:hintIn .4s ease both}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,6px)}}
.tools{position:relative;display:flex;gap:8px;align-items:center;flex:none}
.chip{font:600 11px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);padding:0 12px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;text-align:center;
  border-radius:6px;cursor:pointer;backdrop-filter:blur(6px);transition:color .2s,border-color .2s,background .2s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--gold)}
.chip:focus-visible,.begin:focus-visible,#file:focus-visible+*{outline:2px solid var(--gold);outline-offset:2px}
.chip.primary{min-width:92px;min-height:44px;font-size:12px;letter-spacing:.2em;color:var(--fg);border-color:rgba(var(--glow),.7);
  box-shadow:0 0 18px rgba(var(--glow),.25)}
.chip.primary[aria-pressed="true"]{background:rgba(var(--glow),.2);border-color:var(--gold);box-shadow:0 0 24px rgba(var(--glow),.45)}
.chip.icon{width:44px;min-height:44px;padding:0}
.chip.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.chip.icon[aria-expanded="true"]{color:var(--fg);border-color:var(--gold)}
.tray{position:absolute;z-index:4;top:calc(100% + 8px);right:0;width:min(320px,calc(100vw - 32px));display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:10px;border-radius:10px;background:rgba(3,4,12,.94);border:1px solid rgba(var(--glow),.28);backdrop-filter:blur(10px);
  box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:calc(100dvh - 90px);overflow-y:auto;animation:hintIn .2s ease both}
.tray .chip{width:100%;min-height:44px;padding:6px 8px}
.tray .chip[aria-pressed="true"]{background:rgba(var(--glow),.14)}
.tray #mant,.tray #fileLbl,.tray #vsel{grid-column:1/-1}
.tray #fileLbl{border-style:dashed}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.panel{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:760px;margin:0 auto;padding:14px 14px 12px;border-radius:10px;
  max-height:42dvh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  background:linear-gradient(to top,rgba(2,3,10,.86),rgba(2,3,10,.5));border:1px solid rgba(var(--glow),.2);backdrop-filter:blur(6px)}
.panel::-webkit-scrollbar{display:none}
.modes{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--ph,150px) + 24px);
  max-width:760px;margin:0 auto;display:flex;justify-content:safe center;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 20px;scrollbar-width:none;
  scroll-padding:0 24px;mask-image:linear-gradient(to right,transparent,#000 22px,#000 calc(100% - 22px),transparent);-webkit-mask-image:linear-gradient(to right,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.modes::-webkit-scrollbar{display:none}
.modes .chip{flex:none;scroll-snap-align:center;min-height:40px;padding:0 14px}
.modes .chip[aria-pressed="true"]{background:rgba(var(--glow),.22);color:var(--fg);box-shadow:0 0 14px rgba(var(--glow),.3)}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px}
.w{text-align:center;display:flex;flex-direction:column;gap:3px;max-width:100%}
.w b{font:400 clamp(20px,5vw,28px)/1.4 var(--dev);color:var(--dim);transition:color .25s,text-shadow .25s;text-wrap:balance}
.w i{font:400 11px var(--display);font-style:normal;letter-spacing:.14em;color:color-mix(in srgb,var(--fg) 62%,var(--dim));opacity:.95;text-transform:uppercase}
.w.done b{color:color-mix(in srgb,var(--fg) 78%,var(--dim))}
.w.on b{color:var(--gold);text-shadow:0 0 14px rgba(var(--glow),.9),0 0 32px rgba(var(--glow),.5)}
.w.on i{color:var(--gold);opacity:1}
:root[data-mode="kali"] .w b{font-size:clamp(34px,9vw,52px);line-height:1.25}
.meaning{margin:12px auto 0;max-width:34em;font:400 13px/1.55 var(--display);color:var(--fg);opacity:.85;text-align:center;text-wrap:balance;
  padding-top:10px;border-top:1px solid rgba(var(--glow),.18)}
.gyan .hi{white-space:pre-line}
.gyan{margin:10px auto 0;max-width:34em;text-align:center;text-wrap:balance}
.gyan .hi{font:400 15px/1.55 var(--dev);color:var(--fg)}
.gyan .en{font:400 12px/1.5 var(--display);color:var(--dim);margin-top:2px}
.begin{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--ph,150px) + 88px);
  font:600 14px var(--display);letter-spacing:.22em;text-transform:uppercase;color:#1a0a06;background:var(--gold);border:0;border-radius:40px;
  min-height:48px;padding:0 30px;cursor:pointer;box-shadow:0 0 40px rgba(var(--glow),.55);white-space:nowrap}
@media (min-width:700px){.panel{min-height:130px;display:flex;flex-direction:column;justify-content:center}}
@media (max-width:480px){:root[data-mode="shiva"] .w b{font-size:17px}:root[data-mode="shiva"] .words{gap:4px 12px}:root[data-mode="shiva"] .w i{font-size:9px;letter-spacing:.06em}}
@media (max-width:480px){.chip{letter-spacing:.1em}.hud .id{max-width:calc(100% - 140px)}.title{letter-spacing:.2em}}
@media (max-height:480px) and (orientation:landscape){
  .panel{max-width:min(760px,70vw);padding:8px 12px;max-height:46dvh}.w i{display:none}.w b{font-size:clamp(18px,4vh,24px);line-height:1.3}
  .words{gap:2px 14px}.meaning{margin-top:6px;padding-top:6px;font-size:12px}.modes{max-width:min(760px,70vw)}
  .chip{min-height:36px}.modes .chip{min-height:34px}.begin{min-height:42px;padding:0 24px;font-size:12px}
  .hint{left:max(16px,env(safe-area-inset-left,0px));transform:none;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 84px);max-width:200px;text-align:left;animation:none}.begin{bottom:calc(env(safe-area-inset-bottom,0px) + var(--ph,100px) + 70px)}}
@media (prefers-reduced-motion:reduce){.hint,.tray{animation:none}}
</style>

<canvas id="c" aria-label="Particle deity chanting a mantra in deep space"></canvas>

<div class="hud">
  <div class="id">
    <div class="title" id="ttl">Mahamrityunjaya</div>
    <div class="sub" id="sub">महामृत्युञ्जय मन्त्र</div>
    <div class="status" id="status" role="status">Stillness</div>
  </div>
  <div class="tools" role="group" aria-label="Controls">
    <button class="chip primary" id="chant" type="button" aria-pressed="false">Chant</button>
    <button class="chip icon" id="setBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="tray">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <div class="tray" id="tray" role="group" aria-label="Settings" hidden>
      <button class="chip" id="vsel" type="button" aria-pressed="true" hidden>Voice: Spoken</button>
      <button class="chip" id="mant" type="button" aria-pressed="false">Mantra: Mahamrityunjaya</button>
      <button class="chip" id="choir" type="button" aria-pressed="false">Choir: Off</button>
      <button class="chip" id="ot" type="button" aria-pressed="false" hidden>Overtone: Off</button>
      <button class="chip" id="gather" type="button" aria-pressed="true">Gather: On</button>
      <button class="chip" id="drone" type="button" aria-pressed="true">Drone</button>
      <button class="chip" id="meaningBtn" type="button" aria-pressed="false">Meaning</button>
      <button class="chip" id="gyanBtn" type="button" aria-pressed="false">Gyan</button>
      <label class="chip" for="file" id="fileLbl" tabindex="0">My recording</label>
      <input id="file" type="file" accept="audio/*">
    </div>
  </div>
</div>
<div class="hint" id="hint" role="status" hidden></div>

<div class="modes" id="modes" role="group" aria-label="Choose a figure">
  <button class="chip" id="mS" type="button" aria-pressed="true">Shiva</button>
  <button class="chip" id="mK" type="button" aria-pressed="false">Kali</button>
  <button class="chip" id="mB" type="button" aria-pressed="false">Bhairav</button>
  <button class="chip" id="mM" type="button" aria-pressed="false">Monk</button>
  <button class="chip" id="mGa" type="button" aria-pressed="false">Gayatri</button>
  <button class="chip" id="mGn" type="button" aria-pressed="false">Ganesha</button>
  <button class="chip" id="mT" type="button" aria-pressed="false">Tara</button>
  <button class="chip" id="mH" type="button" aria-pressed="false">Hanuman</button>
</div>
<div class="panel">
  <div class="words" id="words" aria-live="off"></div>
  <p class="meaning" id="meaning" hidden></p>
  <div class="gyan" id="gyan" hidden><div class="hi" id="gyanHi"></div><div class="en" id="gyanEn"></div></div>
</div>
<button class="begin" id="begin" type="button">ॐ &nbsp;Begin the chant</button>

<script>
const $=id=>document.getElementById(id);

/* ================= 1. Mantras and their timing =================
   Syllable: [text, vowel, mouth openness 0-1, lip rounding (negative = spread wide), starts on a lip closure, seconds] */
const WORDS_S=[
 {d:'ॐ',tts:'ओम्',l:'Om',s:[['om','o',.45,1,0,2.8]]},
 {d:'त्र्यम्बकं',l:'Tryambakam',s:[['tryam','a',.7,.1,0,.5],['ba','a',.8,0,1,.5],['kam','a',.6,0,0,.8]]},
 {d:'यजामहे',l:'Yajamahe',s:[['ya','a',.8,0,0,.45],['jaa','a',.95,0,0,.55],['ma','a',.8,0,1,.45],['he','e',.55,0,0,.7]]},
 {d:'सुगन्धिं',l:'Sugandhim',s:[['su','u',.4,.9,0,.45],['gan','a',.75,0,0,.5],['dhim','i',.3,0,0,.9]]},
 {d:'पुष्टिवर्धनम्',l:'Pushtivardhanam',s:[['push','u',.45,.8,1,.45],['ti','i',.3,0,0,.4],['var','a',.7,0,0,.45],['dha','a',.85,0,0,.45],['nam','a',.7,0,0,.9]]},
 {d:'उर्वारुकमिव',l:'Urvarukamiva',s:[['ur','u',.45,.8,0,.45],['vaa','a',.9,0,0,.55],['ru','u',.4,.9,0,.4],['ka','a',.8,0,0,.4],['mi','i',.3,0,1,.4],['va','a',.75,0,0,.6]]},
 {d:'बन्धनान्',l:'Bandhanan',s:[['ban','a',.8,0,1,.45],['dha','a',.85,0,0,.45],['naan','a',.9,0,0,.8]]},
 {d:'मृत्योर्',l:'Mrityor',s:[['mri','i',.3,0,1,.45],['tyor','o',.65,.7,0,.7]]},
 {d:'मुक्षीय',l:'Mukshiya',s:[['muk','u',.45,.9,1,.4],['shii','i',.3,0,0,.5],['ya','a',.8,0,0,.6]]},
 {d:'माऽमृतात्',l:'Mamritat',s:[['maa','a',.95,0,1,.65],['mri','i',.3,0,1,.4],['taat','a',.9,0,0,1.5]]}
];
// Kali's seed sound: a short hard "kr", a long wailing "reeee" with the lips drawn wide, then a closed "mmmm" hum.
const WORDS_K=[{d:'क्रीं',l:'Kreeeeem',s:[['kr','i',.25,-.2,0,.35],['ree','i',.44,-.45,0,3.6],['mm','m',0,0,1,2.4]]}];
// Bhairav: Om Bhram Bhairavaya Namah. "Bhram" is a hard bh, a long open roar, then a closed hum.
const WORDS_B=[
 {d:'ॐ',l:'Om',s:[['om','o',.45,1,0,2.2]]},
 {d:'भ्रं',l:'Bhram',s:[['bh','a',.2,0,1,.35],['hra','a',.95,.1,0,1.5],['mm','m',0,0,1,1.4]]},
 {d:'भैरवाय',l:'Bhairavaya',s:[['bhai','a',.8,0,1,.5],['ra','a',.85,0,0,.45],['va','a',.8,0,0,.4],['ya','a',.75,0,0,.7]]},
 {d:'नमः',l:'Namah',s:[['na','a',.8,0,0,.5],['mah','a',.85,0,1,1.2]]}
];
// Om Mani Padme Hum: slow, even, deep. Six syllables, the last held and closed into a hum.
const WORDS_M=[
 {d:'ॐ',l:'Om',s:[['om','o',.4,1,0,2.4]]},
 {d:'मणि',l:'Mani',s:[['ma','a',.7,0,1,.95],['ni','i',.3,0,0,.95]]},
 {d:'पद्मे',l:'Padme',s:[['pad','a',.7,0,1,.95],['me','e',.5,0,1,.95]]},
 {d:'हूँ',l:'Hum',s:[['hum','u',.4,.8,0,2.8]]}
];
// Om Namah Shivaya (the five syllables Na-Mah-Shi-Va-Ya)
const WORDS_N=[
 {d:'ॐ',l:'Om',s:[['om','o',.45,1,0,2.4]]},
 {d:'नमः',l:'Namah',s:[['na','a',.8,0,0,.7],['mah','a',.85,0,1,1.0]]},
 {d:'शिवाय',l:'Shivaya',s:[['shi','i',.3,0,0,.7],['va','a',.8,0,0,.7],['ya','a',.75,0,0,1.3]]}
];
// Gayatri: five phrases, even and unhurried
const WORDS_GA=[
 {d:'ॐ',l:'Om',s:[['om','o',.4,1,0,2.4]]},
 {d:'भूर्भुवः स्वः',l:'Bhur Bhuvah Svah',s:[['bhuur','u',.4,.9,1,.8],['bhu','u',.4,.9,1,.6],['vah','a',.6,0,0,.7],['svah','a',.6,0,0,.9]]},
 {d:'तत्सवितुर्वरेण्यं',l:'Tat Savitur Varenyam',s:[['tat','a',.7,0,0,.6],['sa','a',.75,0,0,.5],['vi','i',.3,0,0,.5],['tur','u',.4,.9,0,.6],['va','a',.75,0,0,.5],['re','e',.5,0,0,.5],['nyam','a',.6,0,0,1.0]]},
 {d:'भर्गो देवस्य धीमहि',l:'Bhargo Devasya Dhimahi',s:[['bhar','a',.7,0,1,.6],['go','o',.6,.7,0,.7],['de','e',.5,0,0,.5],['va','a',.75,0,0,.5],['sya','a',.7,0,0,.6],['dhii','i',.3,0,0,.6],['ma','a',.8,0,1,.5],['hi','i',.3,0,0,.8]]},
 {d:'धियो यो नः प्रचोदयात्',l:'Dhiyo Yo Nah Prachodayat',s:[['dhi','i',.3,0,0,.5],['yo','o',.6,.7,0,.5],['yo','o',.6,.7,0,.5],['nah','a',.7,0,0,.6],['pra','a',.8,0,1,.5],['cho','o',.6,.7,0,.5],['da','a',.8,0,0,.5],['yaat','a',.9,0,0,1.5]]}
];
// Ganesha: Om Gam Ganapataye Namah
const WORDS_GN=[
 {d:'ॐ',l:'Om',s:[['om','o',.45,1,0,2.2]]},
 {d:'गं',l:'Gam',s:[['gam','a',.8,0,0,1.8]]},
 {d:'गणपतये',l:'Ganapataye',s:[['ga','a',.75,0,0,.45],['na','a',.7,0,0,.45],['pa','a',.8,0,1,.45],['ta','a',.75,0,0,.45],['ye','e',.5,0,0,.7]]},
 {d:'नमः',l:'Namah',s:[['na','a',.8,0,0,.5],['mah','a',.85,0,1,1.2]]}
];
// Green Tara: Om Tare Tuttare Ture Soha
const WORDS_T=[
 {d:'ॐ',l:'Om',s:[['om','o',.4,1,0,2.2]]},
 {d:'तारे',l:'Tare',s:[['ta','a',.75,0,0,.5],['re','e',.5,0,0,.7]]},
 {d:'तुत्तारे',l:'Tuttare',s:[['tut','u',.4,.9,0,.5],['ta','a',.75,0,0,.45],['re','e',.5,0,0,.7]]},
 {d:'तुरे',l:'Ture',s:[['tu','u',.4,.9,0,.5],['re','e',.5,0,0,.8]]},
 {d:'स्वाहा',l:'Svaha',s:[['so','o',.6,.7,0,.6],['ha','a',.85,0,0,1.4]]}
];
// Hanuman: Om Ham Hanumate Namah
const WORDS_H=[
 {d:'ॐ',l:'Om',s:[['om','o',.45,1,0,2.2]]},
 {d:'हँ',l:'Ham',s:[['ham','a',.8,0,0,1.6]]},
 {d:'हनुमते',l:'Hanumate',s:[['ha','a',.8,0,0,.45],['nu','u',.4,.9,0,.45],['ma','a',.8,0,1,.45],['te','e',.5,0,0,.7]]},
 {d:'नमः',l:'Namah',s:[['na','a',.8,0,0,.5],['mah','a',.85,0,1,1.2]]}
];
function buildTL(words,pause){ const tl=[]; let T=0;
  words.forEach((w,wi)=>{ w.first=tl.length; w.sumD=0; w.sc=.7;
    w.s.forEach(([tx,v,o,r,lab,d])=>{ tl.push({tx,v,o,r,lab,t0:T,t1:T+d,wi}); T+=d; w.sumD+=d; });
    w.last=tl.length-1; T+=pause[wi]||.05; });
  return {tl,total:T}; }
const MODES={

    mq.addColorStop(0,'rgba('+mpc+','+(modePulse*modePulse*.22).toFixed(3)+')'); mq.addColorStop(1,'rgba('+mpc+',0)');
    cx.globalAlpha=1; cx.fillStyle=mq; cx.fillRect(hx-mr,hy-mr,mr*2,mr*2); }
  if(wtMoving||!ringC) ringC=mix3([242,196,109],[255,50,70],[255,150,60],[255,194,74],[255,179,71],[255,143,74],[126,224,168],[255,122,42],[188,208,255]);
  cx.lineWidth=1; cx.strokeStyle=ringC;
  for(let k=0;k<5;k++){ const r=(185+k*40)*S; cx.globalAlpha=(.14+energy*.35)*(1-k*.12); cx.setLineDash([2+k*3,9+k*5]);
    cx.beginPath(); cx.arc(hx,hy,r,tm*(k%2?-.05:.05)*(1+k*.2),tm*(k%2?-.05:.05)*(1+k*.2)+6.283); cx.stroke(); }
  cx.setLineDash([]);
  for(let i=ripples.length-1;i>=0;i--){ const rp=ripples[i], age=Math.max(0,(now-rp.t0)/2200); if(age>1){ ripples.splice(i,1); continue; }
    cx.globalAlpha=(1-age)*.45*rp.str; cx.lineWidth=1.5; cx.strokeStyle=RIP[cur][age<.5?0:1]; cx.beginPath(); cx.arc(hx,hy,(150+age*340)*S,0,6.283); cx.stroke(); }

  // ---- figure ----
  const SW=RM.matches?.3:1, breatheY=Math.sin(t*.8)*3*S*SW, MY=348, openPx=mouthOpen*30, hw=(cur==='hanuman'?42:36)*(1-.42*mouthRound);
  const tongueL=22+energy*46+Math.sin(t*3)*3*energy;
  if(wtMoving||!cssC){ cssC=cssC||{}; for(const k in COLS.shiva) cssC[k]=mixK(k); }
  const css=cssC, drag=Math.pow(.001,dt), cb=1+climax*.6, pq=QL>=2?3:QL>=1?2:1;
  const yc=Math.cos(yaw), ys=Math.sin(yaw), pc=Math.cos(pitch+TILT0), ps=Math.sin(pitch+TILT0);   // trig shared by every w=1 particle
  const gs2=stage*stage*(3-2*stage), gca=Math.cos((1-gs2)*2.8), gsa=Math.sin((1-gs2)*2.8);
  for(const kd of KINDS){
    const k=kd.k, vis=VIS[k]; if(vis<.02) continue;
    cx.fillStyle=css[k]; cx.globalCompositeOperation=GLOW[k]?'lighter':'source-over';
    const thin=pq>1&&DENSE.has(k), sz=SIZE[k]*Math.max(.9,S*(SKIN.has(k)?.95:1))*(1+climax*.25)*(thin?1.2:1);
    for(let i=kd.a;i<kd.b;i++){
      if(thin&&i%pq) continue;
      const p=FP[i]; let mx=p.mx,my=p.my,mz=p.mz;
      if(p.lip){ const L=p.lip, e=1-L.u*L.u, gapHalf=openPx*e/2;
        if(L.inner){ my=MY+(L.v-.5)*2*gapHalf; mx=L.u*hw; mz=domeZ(250+mx,my)+4; }
        else { const side=L.up?-1:1, th=(L.up?8:11)*(.35+.65*Math.pow(e,.55))*(1+.25*mouthRound);
          my=MY+side*(gapHalf+th*L.v)-3.5*L.u*L.u*(1-mouthOpen); mx=L.u*hw; mz=domeZ(250+mx,my)+8; } }
      else if(p.fg){ const F=p.fg; mx=F.s*15+F.u*(1-F.v)*3.5; my=MY-openPx*.5+2+F.v*(9+openPx*.35); mz=domeZ(250,MY)+8; }
      else if(p.tg){ const T=p.tg; mx=T.u*15*(1-.4*T.v); my=MY+openPx*.5+8+T.v*tongueL; mz=domeZ(250,MY)+10+T.v*14; }
      const w=p.w; let cy,sy,cp,sp2; if(w===1){ cy=yc; sy=ys; cp=pc; sp2=ps; } else { const yw=yaw*w, pw=(pitch+TILT0)*w; cy=Math.cos(yw); sy=Math.sin(yw); cp=Math.cos(pw); sp2=Math.sin(pw); }
      let rx=mx*cy+mz*sy; const rz=-mx*sy+mz*cy, ry=my-260; let ry2=ry*cp-rz*sp2;
      if(rollA){ const ca=Math.cos(rollA*w), sa=Math.sin(rollA*w), q=ry2-120, nx=rx*ca-q*sa; ry2=rx*sa+q*ca+120; rx=nx; }
      let tx=baseX+rx*S, ty=Y0+(ry2+260)*S+breatheY*(my<430?1:.4);
      if(k==='trunk') tx+=Math.sin(t*1.4)*(my-236)*.03*S*(1+energy)*SW;
      if((k==='hair'||k==='hairK'||k==='beard'||k==='ribbon')&&my>150) tx+=Math.sin(t*.9+my*.012+p.ph*.15)*(my-120)*.035*S*SW;
      if(k==='hairK'&&energy>.05) tx+=(Math.random()-.5)*energy*4*S*SW;
      if(stage<1){ const ex=p.ix+(tx-p.ix)*gs2-hx, ey=p.iy+(ty-p.iy)*gs2-hy; tx=hx+ex*gca-ey*gsa; ty=hy+ex*gsa+ey*gca; }
      const spd=(p.lip||p.tg||p.fg)?40:(stage<1?22:14);
      p.vx+=(tx-p.x)*spd*dt; p.vy+=(ty-p.y)*spd*dt;
      if(ptr.inside&&!p.lip&&!p.tg&&!p.fg){ const dx=p.x-ptr.x, dy=p.y-ptr.y, d2=dx*dx+dy*dy; if(d2<4900&&d2>1){ const d=Math.sqrt(d2), f=(1-d/70)*600*dt; p.vx+=dx/d*f; p.vy+=dy/d*f; } }
      p.vx*=drag; p.vy*=drag; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.lip||p.tg||p.fg){ p.x=tx; p.y=ty; }
      let a;
      if(SKIN.has(k)){ const l=Math.max(0,Math.min(1,rz/100)); a=(k!=='body'?.55:.4)+.45*l+.06*Math.sin(t*1.7+p.ph); }
      else if(k==='third') a=.6+.4*Math.sin(t*2.2+p.ph)+energy*.5;
      else if(k==='lip') a=.85-.55*WT.shiva; else if(k==='inner') a=Math.min(.8,mouthOpen*1.4)*.8; else if(k==='tongue') a=.9; else if(k==='fang') a=Math.min(1,mouthOpen*4);
      else if(k==='hairK') a=.55+.35*Math.sin(t*3+p.ph)+energy*.3;
      else if(k==='trunk'||k==='earG') a=.95;
      else a=.8;
      let ab=(a>1?1:a)*vis*cb; if(!(p.lip||p.tg||p.fg)&&ty>FADE0){ ab*=Math.max(k==='skull'?.45:0,1-(ty-FADE0)/50); } cx.globalAlpha=ab>1?1:ab; const dz=sz*(1+(rz>100?100:rz<-100?-100:rz)*.0009);   // nearer particles a touch larger: subtle depth
      cx.fillRect(p.x,p.y,dz,dz);
    }
  }
  // third-eye and moon blooms
  cx.globalCompositeOperation='lighter';
  const te=[baseX+(domeZ(250,193)+6)*Math.sin(yaw)*S, Y0+193*S+breatheY];
  const bl=cx.createRadialGradient(te[0],te[1],0,te[0],te[1],34*S*(1+energy*.9+climax*.8));
  const bc=BLOOM[cur]||'255,215,150';
  bl.addColorStop(0,'rgba('+bc+','+Math.min(1,.45+energy*.4+climax*.4).toFixed(3)+')'); bl.addColorStop(1,'rgba(255,100,60,0)');
  cx.globalAlpha=1; cx.fillStyle=bl; cx.fillRect(te[0]-120*S,te[1]-120*S,240*S,240*S);
  if(WT.shiva>.05){ const mp=[baseX+(372-250)*S, Y0+92*S+breatheY], mg=cx.createRadialGradient(mp[0],mp[1],0,mp[0],mp[1],46*S);
    mg.addColorStop(0,'rgba(220,230,255,'+(.3*WT.shiva).toFixed(3)+')'); mg.addColorStop(1,'rgba(220,230,255,0)'); cx.fillStyle=mg; cx.fillRect(mp[0]-46*S,mp[1]-46*S,92*S,92*S); }
  if(mouthOpen>.03){   // warm light spilling from the open mouth, tinted by the mode
    const mz2=domeZ(250,MY)+8, mgx=baseX+mz2*Math.sin(yaw)*S, mgy=Y0+((MY-260)*pc-mz2*yc*ps+260)*S+breatheY, mr=(24+openPx*1.15)*S*(1+climax*.3), mc=MOUTHC[dom]||MOUTHC.shiva, ma=Math.min(1,mouthOpen);
    const mgr=cx.createRadialGradient(mgx,mgy,0,mgx,mgy,mr); mgr.addColorStop(0,'rgba(255,238,215,'+(.34*ma).toFixed(3)+')'); mgr.addColorStop(.3,'rgba('+mc+','+(.26*ma).toFixed(3)+')'); mgr.addColorStop(1,'rgba('+mc+',0)');
    cx.globalAlpha=1; cx.fillStyle=mgr; cx.fillRect(mgx-mr,mgy-mr,mr*2,mr*2); }
  if(climax>.01){   // the moment the figure forms: a bright shock of light that blooms outward and fades
    const cr=(120+(1-climax)*300)*S, cf=climax*climax*(RM.matches?.25:.55), cg=cx.createRadialGradient(hx,hy,0,hx,hy,cr);
    cg.addColorStop(0,'rgba(255,250,235,'+cf.toFixed(3)+')'); cg.addColorStop(.35,'rgba('+(BLOOM[cur]||'255,215,150')+','+(cf*.55).toFixed(3)+')'); cg.addColorStop(1,'rgba('+(BLOOM[cur]||'255,215,150')+',0)');
    cx.globalAlpha=1; cx.fillStyle=cg; cx.fillRect(hx-cr,hy-cr,cr*2,cr*2); }
  cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
  rafId=requestAnimationFrame(frame);
}
rafId=requestAnimationFrame(frame);
const panelEl=document.querySelector('.panel'); const setPH=()=>document.documentElement.style.setProperty('--ph',panelEl.offsetHeight+'px');
try{ new ResizeObserver(()=>{ setPH(); layoutSoon(); }).observe(panelEl); }catch(e){} setPH(); layoutSoon();
markWord(-1);
</script>
